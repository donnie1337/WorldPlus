name: Build WorldPlus

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Upload WorldPlus.jar
        uses: actions/upload-artifact@v4
        with:
          name: WorldPlus
          path: target/WorldPlus.jar
