  rtp-preparando:
    habilitado: true
    titulo: "&b&lᴛᴇʟᴇᴘᴏʀᴛᴇ"
    subtitulo: "&7Preparando seu destino..."
    fade-in: 10
    duracao: 40
    fade-out: 10

  bioma:
    habilitado: true
    titulo: ""
    subtitulo: "&7Você está {artigo} &f{bioma}"
    fade-in: 5
    duracao: 40
    fade-out: 10
    artigo-padrao: "no"

