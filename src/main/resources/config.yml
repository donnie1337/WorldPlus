# ============================================================
# WorldPlus
# Geração e gerenciamento de mundos
# ============================================================

configuracao:
  criar-mundos-automaticamente: true
  aplicar-datapack-sem-stronghold: true
  mensagem-console: true
  aplicar-configuracoes-ao-carregar: true

# Tamanho da borda em blocos.
# 10000 = 10.000 x 10.000 blocos.
#
# Os valores abaixo também podem ser usados para configurar cada
# mundo individualmente.
mundos:

  overworld:
    nome: "world"
    ambiente: "NORMAL"
    seed: -847392615028471936
    tamanho: 10000
    estruturas: true
    remover-strongholds: true
    pvp: true
    manter-inventario: true
    dificuldade: "NORMAL"
  mineracao:
    nome: "mining"
    ambiente: "NORMAL"
    seed: 593817204761928405
    tamanho: 7000
    estruturas: true
    remover-strongholds: true
    pvp: true
    manter-inventario: true
    dificuldade: "NORMAL"
  nether:
    nome: "world_nether"
    ambiente: "NETHER"
    seed: -2615049381726503847
    tamanho: 7000
    estruturas: true
    remover-strongholds: false
    pvp: true
    manter-inventario: true
    dificuldade: "HARD"
  end:
    nome: "world_the_end"
    ambiente: "THE_END"
    seed: 731946205817394602
    tamanho: 7000
    estruturas: true
    remover-strongholds: false
    remover-dragao: true
    remover-torres: true
    remover-bedrock: true
    pvp: true
    manter-inventario: true
    dificuldade: "HARD"

rtp:
  geral:
    atraso-segundos: 5
    cancelar-ao-mover: true
    # Tempo mínimo entre usos do /rtp.
    # 15 segundos dão tempo para o servidor concluir o processamento
    # e a geração/carregamento das chunks antes de outro RTP.
    cooldown-segundos: 15
    max-tentativas: 32
    blocos-bloqueados:
      - water
      - lava
      - cactus
      - fire
      - soul_fire
      - magma_block
      - campfire
      - soul_campfire
      - powder_snow
      - sweet_berry_bush
      - pointed_dripstone
      - bedrock
      - air
      - cave_air
      - void_air

  gui:
    habilitado: true
    titulo: "&8&lRTP &8• &fEscolha o mundo"

  mundos:
    overworld:
      habilitado: true
      usar-borda: true
      centro-x: 0
      centro-z: 0
      raio-minimo: 250
      raio-maximo: 4800
      formato: "circle"
      y-minimo: 0
      y-maximo: 320
      cooldown-segundos: 15

    mineracao:
      habilitado: true
      usar-borda: true
      centro-x: 0
      centro-z: 0
      raio-minimo: 150
      raio-maximo: 3300
      formato: "circle"
      y-minimo: 0
      y-maximo: 320
      cooldown-segundos: 15

    nether:
      habilitado: true
      usar-borda: true
      centro-x: 0
      centro-z: 0
      raio-minimo: 100
      raio-maximo: 3300
      formato: "circle"
      y-minimo: 32
      y-maximo: 120
      cooldown-segundos: 15

    end:
      habilitado: true
      usar-borda: true
      centro-x: 0
      centro-z: 0
      raio-minimo: 250
      raio-maximo: 3300
      formato: "circle"
      y-minimo: 0
      y-maximo: 320
      cooldown-segundos: 15

# ============================================================
# Titles
# ============================================================
# O title de RTP aparece somente no primeiro RTP do jogador durante
# a sessão. Depois disso, o sistema mostra o bioma sempre que ele
# entrar em um bioma diferente.

titles:
  rtp-preparando:
    habilitado: true
    titulo: "&f&lᴛᴇʟᴇᴘᴏʀᴛᴇ"
    subtitulo: "&7Preparando seu destino..."
    fade-in: 10
    duracao: 40
    fade-out: 10

  bioma:
    habilitado: true
    # Visual inspirado na atmosfera de Hollow Knight:
    # título limpo, subtítulo destacado, bastante espaço visual.
    fade-in: 10
    duracao: 50
    fade-out: 15
    padrao:
      titulo: "&fVocê está {artigo}"
      subtitulo: "&f&l{bioma}"

