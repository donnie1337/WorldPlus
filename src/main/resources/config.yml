# ============================================================
# WorldPlus
# Geração e gerenciamento de mundos
# ============================================================

configuracao:
  criar-mundos-automaticamente: true
  aplicar-datapack-sem-stronghold: true
  mensagem-console: true
  aplicar-configuracoes-ao-carregar: true

# Tamanho da borda em blocos.
# 10000 = 10.000 x 10.000 blocos.
#
# Os valores abaixo também podem ser usados para configurar cada
# mundo individualmente.
mundos:

  overworld:
    nome: "world"
    ambiente: "NORMAL"
    seed: -847392615028471936
    tamanho: 10000
    estruturas: true
    remover-strongholds: true
    pvp: true
    manter-inventario: true
    dificuldade: "NORMAL"
  mineracao:
    nome: "mining"
    ambiente: "NORMAL"
    seed: 593817204761928405
    tamanho: 7000
    estruturas: true
    remover-strongholds: true
    pvp: true
    manter-inventario: true
    dificuldade: "NORMAL"
  nether:
    nome: "world_nether"
    ambiente: "NETHER"
    seed: -2615049381726503847
    tamanho: 7000
    estruturas: true
    remover-strongholds: false
    pvp: true
    manter-inventario: true
    dificuldade: "HARD"
  end:
    nome: "world_the_end"
    ambiente: "THE_END"
    seed: 731946205817394602
    tamanho: 7000
    estruturas: true
    remover-strongholds: false
    remover-dragao: true
    remover-torres: true
    remover-bedrock: true
    pvp: true
    manter-inventario: true
    dificuldade: "HARD"

# Apenas estes mundos são apagados e recriados automaticamente. O Overworld
# não entra nesta lista e é bloqueado pelo código mesmo se for adicionado aqui.
reset-mundos:
  habilitado: true
  intervalo-dias: 90
  mundos:
    - "mineracao"
    - "nether"
    - "end"
  proximos-resets: {}

rtp:
  # Temporário: registra todas as etapas do RTP no console.
  debug: true

  geral:
    atraso-segundos: 3
    cancelar-ao-mover: false
    # Tempo mínimo entre usos do /rtp.
    # Tempo mínimo entre usos do /rtp.
    cooldown-segundos: 5
    # Tempo de espera antes de iniciar a busca do destino.
    pre-carregar-segundos: 3
    max-tentativas: 32
    blocos-bloqueados:
      - water
      - lava
      - cactus
      - fire
      - soul_fire
      - magma_block
      - campfire
      - soul_campfire
      - powder_snow
      - sweet_berry_bush
      - pointed_dripstone
      - bedrock
      - air
      - cave_air
      - void_air

  # Paper gera e carrega chunks de RTP de forma assíncrona. A fila evita
  # uma quantidade excessiva de gerações simultâneas em horários de pico.
  desempenho:
    cargas-simultaneas-maximas: 2
    tamanho-maximo-da-fila: 200

  mensagens:
    rtp-em-andamento: "&cAguarde para se teleportar novamente."
    cooldown: "&cAguarde &f{tempo} segundos &cpara usar o teleporte novamente."
    mundo-nao-encontrado: "&cMundo de RTP não encontrado: &f{id}&c."
    mundo-desativado: "&cO RTP está desativado neste mundo."
    sem-permissao-rtp: "&cVocê não tem permissão para usar o RTP neste mundo."
    erro: "&cNão foi possível carregar o mundo de RTP."
    local-nao-encontrado: "&cNão foi possível encontrar um local seguro para o RTP."
    atraso-cancelado: "&cRTP cancelado porque você se moveu."

  gui:
    habilitado: true

    # Tamanho do inventário. Use 9, 18, 27, 36, 45 ou 54.
    tamanho: 27

    # Título do menu.
    titulo: "&0&lRTP &8• &fEscolha seu mundo"

    # Cada mundo pode definir material, nome, lore e slot.
    # Placeholders disponíveis na lore:
    # {mundo} = nome exibido do mundo
    # {id} = identificador do mundo
    # {tamanho} = tamanho total do mundo
    mundos:
      overworld:
        slot: 10
        material: "GRASS_BLOCK"
        nome: "&a&lᴏᴠᴇʀᴡᴏʀʟᴅ &8• &f(Principal)"
        lore:
          - "&fO mundo principal do servidor,"
          - "&fconstrua sua casa e farms aqui"
          - "&fsem limite para evoluir."
          - ""
          - "&7Informações:"
          - "&e▪ &7Tamanho: &a{tamanho}"
          - "&e▪ &7Reset: &cNunca"
          - "&e▪ &7Proteção: &aSim"
          - "&e▪ &7PvP: &eOpcional &8(/pvp)"
          - ""
          - "&aClique para teleportar."

      mineracao:
        slot: 12
        material: "DEEPSLATE_DIAMOND_ORE"
        nome: "&e&lᴍɪɴᴇʀᴀçãᴏ &8• &f(Mineração)"
        lore:
          - "&fExtraia recursos e encontre novos"
          - "&fdesafios para evoluir sua jornada."
          - ""
          - "&7Informações:"
          - "&e▪ &7Tamanho: &a{tamanho}"
          - "&e▪ &7Reset: &eA cada 90 dias"
          - "&e▪ &7Proteção: &aSim"
          - "&e▪ &7PvP: &eOpcional &8(/pvp)"
          - ""
          - "&eClique para teleportar."

      nether:
        slot: 14
        material: "NETHERRACK"
        nome: "&c&lɴᴇᴛʜᴇʀ &8• &f(Inferno)"
        lore:
          - "&fAtravesse o fogo e enfrente os"
          - "&fperigos da dimensão infernal."
          - ""
          - "&7Informações:"
          - "&e▪ &7Tamanho: &a{tamanho}"
          - "&e▪ &7Reset: &eA cada 90 dias"
          - "&e▪ &7Proteção: &aSim"
          - "&e▪ &7PvP: &eOpcional &8(/pvp)"
          - ""
          - "&cClique para teleportar."

      end:
        slot: 16
        material: "END_STONE"
        nome: "&5&lᴛʜᴇ ᴇɴᴅ &8• &f(Fim)"
        lore:
          - "&fExplore as ilhas distantes e os"
          - "&fmistérios da dimensão do Fim."
          - ""
          - "&7Informações:"
          - "&e▪ &7Tamanho: &a{tamanho}"
          - "&e▪ &7Reset: &eA cada 90 dias"
          - "&e▪ &7Proteção: &aSim"
          - "&e▪ &7PvP: &eOpcional &8(/pvp)"
          - ""
          - "&5Clique para teleportar."

  mundos:
    overworld:
      habilitado: true
      usar-borda: true
      centro-x: 0
      centro-z: 0
      raio-minimo: 100
      raio-maximo: 4800
      formato: "circle"
      y-minimo: 0
      y-maximo: 320
      cooldown-segundos: 5

    mineracao:
      habilitado: true
      usar-borda: true
      centro-x: 0
      centro-z: 0
      raio-minimo: 100
      raio-maximo: 3300
      formato: "circle"
      y-minimo: 0
      y-maximo: 320
      cooldown-segundos: 5

    nether:
      habilitado: true
      usar-borda: true
      centro-x: 0
      centro-z: 0
      raio-minimo: 100
      raio-maximo: 3300
      formato: "circle"
      y-minimo: 32
      y-maximo: 120
      cooldown-segundos: 5

    end:
      habilitado: true
      usar-borda: true
      centro-x: 0
      centro-z: 0
      raio-minimo: 100
      raio-maximo: 3300
      formato: "circle"
      y-minimo: 0
      y-maximo: 320
      cooldown-segundos: 5

